<section id="nosotras" class="team section">
  <div class="team__head">
    <span class="eyebrow">El equipo</span>
    <h2>Nosotras</h2>
  </div>
  <div class="team__grid">
    <article class="team__card" *ngFor="let member of team">
      <div class="team__photo">
        <img [src]="member.photo" [alt]="member.name" class="team__photo-img" />
      </div>
      <h3>{{ member.name }}</h3>
      <p class="team__role">{{ member.role }}</p>
      <a
        class="team__ig"
        [href]="member.instagramUrl"
        target="_blank"
        rel="noopener"
        [attr.aria-label]="'Instagram de ' + member.name"
        >Instagram</a
      >
    </article>
  </div>
</section>
