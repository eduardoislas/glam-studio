<section id="top" class="hero">
  <div class="hero__content">
    <span class="eyebrow">Estudio de belleza · Cd. Obregón</span>
    <h1 class="hero__title">Maquillaje &amp; Peinado en Cd. Obregón</h1>
    <p class="hero__subtitle">
      Realza tu belleza para cada ocasión especial.
    </p>
    <div class="hero__actions">
      <a class="btn-primary" [href]="whatsappUrl" target="_blank" rel="noopener"
        >Agenda tu cita</a
      >
      <a class="hero__link" href="#servicios">Ver servicios ↓</a>
    </div>
  </div>
  <div class="hero__frame">
    <div class="hero__ticks" aria-hidden="true"></div>
    <div class="hero__frame-inner">
      <img
        src="/hero/hero.png"
        alt="Sofía y Perla, fundadoras de Glam Studio"
        class="hero__frame-img"
      />
      <div class="hero__stamp" aria-hidden="true">
        <span class="frame-code">N.09</span>
        <span class="hero__stamp-label">Glam Studio · Cd. Obregón</span>
      </div>
    </div>
    <div class="hero__ticks" aria-hidden="true"></div>
  </div>
</section>
