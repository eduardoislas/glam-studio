<section id="servicios" class="services section">
  <div class="services__head">
    <span class="eyebrow">Lo que hacemos</span>
    <h2>Servicios</h2>
  </div>
  <div class="services__grid">
    <article class="services__card" *ngFor="let service of services">
      <div class="services__icon" [ngSwitch]="service.icon" aria-hidden="true">
        <svg *ngSwitchCase="'brush'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 3.5l6 6-8.5 8.5-6.5 1.5 1.5-6.5 7.5-9.5z" />
          <path d="M13 6l5 5" />
        </svg>
        <svg *ngSwitchCase="'rings'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="14" r="4.5" />
          <circle cx="15.5" cy="10.5" r="4.5" />
        </svg>
        <svg *ngSwitchCase="'comb'" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5v14" />
          <path d="M4 5h3v3H4z" />
          <path d="M4 9.5h3v3H4z" />
          <path d="M4 14h3v3H4z" />
          <path d="M9 6.5c4-2.5 8 0.5 11 0" />
          <path d="M9 12c4-2.5 8 0.5 11 0" />
        </svg>
      </div>
      <h3>{{ service.name }}</h3>
      <p>{{ service.description }}</p>
    </article>
  </div>
</section>
